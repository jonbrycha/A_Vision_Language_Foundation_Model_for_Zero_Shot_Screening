[build-system]
requires = ["setuptools==68.2.2", "wheel==0.41.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hicpg"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.1.0",
  "torchvision==0.16.0",
  "open-clip-torch==2.23.0",
  "transformers==4.35.2",
  "huggingface-hub==0.19.4",
  "numpy==1.26.2",
  "pandas==2.1.3",
  "scikit-learn==1.3.2",
  "scipy==1.11.4",
  "Pillow==10.1.0",
  "PyYAML==6.0.1",
]

[project.scripts]
hicpg = "hicpg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
